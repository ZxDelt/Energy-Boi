<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Boi 1.0.9</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #12162a; font-family: "Segoe UI", "Nunito", Arial, sans-serif; color: #faf6ec; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: #12162a; display: block; }
      #eb-start { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #12162a; z-index: 10; }
      #eb-start h1 { font-size: 64px; margin: 0 0 6px 0; }
      #eb-start .tag { color: #ee9a2a; font-size: 20px; margin-bottom: 26px; }
      #eb-bar { width: 360px; height: 10px; background: #2a3050; border-radius: 6px; overflow: hidden; }
      #eb-fill { width: 0%; height: 100%; background: #ee9a2a; transition: width 0.15s; }
      #eb-msg { margin-top: 16px; font-size: 15px; color: #c9cbe0; max-width: 620px; text-align: center; line-height: 1.5; }
      #eb-ver { position: fixed; left: 12px; bottom: 10px; font-size: 12px; color: #8b8fb0; z-index: 11; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="eb-start">
      <h1>Energy Boi</h1>
      <div class="tag">One district. Nine years. Keep the lights on.</div>
      <div id="eb-bar"><div id="eb-fill"></div></div>
      <div id="eb-msg">Loading...</div>
    </div>
    <div id="eb-ver">Energy Boi 1.0.9</div>
    <script>
      // ----- measurement hooks used by the performance gates -----
      (function () {
        var raf = window.requestAnimationFrame.bind(window);
        var p = window.ebPerf = {
          frames: 0, sum: 0, max: 0, over33: 0, loadStart: performance.now(), interactiveMs: -1,
          reset: function () { p.frames = 0; p.sum = 0; p.max = 0; p.over33 = 0; },
          avg: function () { return p.frames ? p.sum / p.frames : 0; }
        };
        window.requestAnimationFrame = function (cb) {
          return raf(function (t) {
            var s = performance.now();
            cb(t);
            var d = performance.now() - s;
            p.frames++; p.sum += d;
            if (d > p.max) p.max = d;
            if (d > 33) p.over33++;
          });
        };
      })();

      // ----- graphics API choice: WebGPU first, WebGL 2 fallback -----
      var params = new URLSearchParams(window.location.search);
      var forceWebGL2 = params.get("api") === "webgl2";
      var hasWebGPU = !!navigator.gpu && !forceWebGL2;
      if (forceWebGL2) {
        try { Object.defineProperty(Navigator.prototype, "gpu", { get: function () { return undefined; }, configurable: true }); } catch (e) { }
      }
      var msg = document.getElementById("eb-msg");
      var hasWebGL2 = (function () { try { return !!document.createElement("canvas").getContext("webgl2"); } catch (e) { return false; } })();
      window.ebApiPlan = hasWebGPU ? "WebGPU" : (hasWebGL2 ? "WebGL 2" : "none");
      if (!hasWebGPU && hasWebGL2) {
        msg.textContent = "Loading with WebGL 2. WebGPU is not available in this browser; desktop Chrome and Edge give the best results.";
      } else if (!hasWebGPU && !hasWebGL2) {
        msg.textContent = "This browser supports neither WebGPU nor WebGL 2, so the game cannot run here. Please use a current desktop Chrome, Edge, Firefox or Safari.";
      }
    </script>
    <script src="Build/WebStaging.loader.js"></script>
    <script>
      if (window.ebApiPlan !== "none") {
        createUnityInstance(document.querySelector("#unity-canvas"), {
          arguments: [],
          dataUrl: "Build/WebStaging.data.br",
          frameworkUrl: "Build/WebStaging.framework.js.br",
          codeUrl: "Build/WebStaging.wasm.br",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Top Galaxy",
          productName: "Energy Boi",
          productVersion: "1.0.9"
        }, function (progress) {
          document.getElementById("eb-fill").style.width = Math.round(progress * 100) + "%";
        }).then(function (instance) {
          window.ebInstance = instance;
          window.ebPerf.interactiveMs = performance.now() - window.ebPerf.loadStart;
          document.getElementById("eb-start").style.display = "none";
          document.getElementById("eb-ver").style.display = "none";
          document.querySelector("#unity-canvas").focus();
        }).catch(function (message) {
          msg.textContent = "The game failed to start: " + message;
        });
      }
    </script>
  </body>
</html>
